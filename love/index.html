<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你是否喜欢上一个人？💕 少女心趣味测试</title>
<style>
  :root {
    --pink-deep: #ff6fa5;
    --pink-main: #ff9ec4;
    --pink-soft: #ffd3e4;
    --pink-pale: #fff0f6;
    --purple-pink: #ffb3d1;
    --text: #8a4a63;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffe3f0 0%, #ffd0e4 40%, #ffc2da 70%, #ffb3d1 100%);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 漂浮爱心背景 ===== */
  .hearts-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .float-heart {
    position: absolute;
    bottom: -60px;
    animation: floatUp linear infinite;
    opacity: 0;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .55; }
    50%  { opacity: .75; }
    90%  { opacity: .45; }
    100% { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
  }

  /* ===== 闪耀星光 ===== */
  .sparkle {
    position: absolute;
    color: #fff;
    animation: twinkle 3s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(255,255,255,.9);
    user-select: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50%      { opacity: .9; transform: scale(1); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 16px 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 28px;
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 12px 40px rgba(255, 111, 165, 0.28), inset 0 0 0 1px rgba(255,255,255,.6);
    padding: 36px 28px;
    text-align: center;
  }

  /* ===== 开场页 ===== */
  .title-badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, var(--pink-deep), #ff8fc0);
    padding: 6px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(255,111,165,.4);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 34px;
    line-height: 1.35;
    font-weight: 800;
    background: linear-gradient(135deg, #ff5d9e, #ff8fb8 55%, #d98cf5);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 15px;
    color: #b26a87;
    margin-bottom: 28px;
    line-height: 1.8;
  }
  .start-btn, .again-btn {
    cursor: pointer;
    border: none;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 4px;
    padding: 15px 46px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff6fa5, #ff9ec4 60%, #ffb3d1);
    box-shadow: 0 8px 22px rgba(255, 111, 165, 0.45);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .start-btn:hover, .again-btn:hover {
    transform: translateY(-3px) scale(1.04);
    filter: brightness(1.06);
    box-shadow: 0 12px 28px rgba(255, 111, 165, 0.55);
  }
  .start-btn:active, .again-btn:active { transform: scale(.96); }
  .tip {
    margin-top: 22px;
    font-size: 12.5px;
    color: #c98aa3;
  }

  /* ===== 答题页 ===== */
  .progress-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .progress-text {
    font-size: 13px;
    color: #c17997;
    white-space: nowrap;
    font-weight: 600;
  }
  .progress-track {
    flex: 1;
    height: 14px;
    background: #ffe3ef;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255,111,165,.25);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff6fa5, #ff9ec4, #d98cf5);
    transition: width .5s cubic-bezier(.22,.9,.35,1);
    position: relative;
  }
  .progress-fill::after {
    content: "💗";
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%) scale(.8);
  }

  .q-count {
    font-size: 12px;
    color: #d39ab2;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }
  .question {
    font-size: 21px;
    font-weight: 800;
    line-height: 1.6;
    margin-bottom: 26px;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .option {
    cursor: pointer;
    border: 2px solid #ffd3e4;
    background: #fffafd;
    border-radius: 18px;
    padding: 15px 18px;
    font-size: 15.5px;
    color: #8a4a63;
    text-align: left;
    line-height: 1.6;
    transition: all .2s ease;
    box-shadow: 0 3px 10px rgba(255,111,165,.08);
  }
  .option:hover {
    border-color: var(--pink-main);
    background: #fff2f8;
    transform: translateX(4px);
    box-shadow: 0 6px 16px rgba(255,111,165,.18);
  }
  .option.selected {
    border-color: var(--pink-deep);
    background: linear-gradient(135deg, #ffe3f0, #fff0f6);
    transform: scale(1.02);
    box-shadow: 0 6px 18px rgba(255,111,165,.28);
  }
  .option .opt-emoji { margin-right: 8px; }

  /* ===== 结果页 ===== */
  .result-emoji {
    font-size: 64px;
    margin-bottom: 8px;
    animation: bounce 1.6s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  .result-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ff5d9e, #d98cf5);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .score-ring {
    width: 140px;
    height: 140px;
    margin: 18px auto 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(var(--pink-deep) calc(var(--pct) * 1%), #ffe3ef 0);
    position: relative;
  }
  .score-ring::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: #fff;
  }
  .score-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .score-num {
    font-size: 30px;
    font-weight: 800;
    color: var(--pink-deep);
  }
  .score-label {
    font-size: 12px;
    color: #c17997;
    letter-spacing: 1px;
  }
  .result-desc {
    font-size: 15px;
    line-height: 2;
    color: #8a4a63;
    margin-bottom: 26px;
    background: #fff6fb;
    border: 1px dashed #ffb3d1;
    border-radius: 16px;
    padding: 16px 18px;
    text-align: left;
  }
  .result-desc b { color: #ff5d9e; }

  /* 结果页落下的爱心 */
  .falling-heart {
    position: absolute;
    top: -40px;
    animation: fall linear forwards;
    pointer-events: none;
    user-select: none;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(360deg); opacity: .9; }
  }

  .hidden { display: none !important; }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: #c98aa3;
    text-align: center;
  }
</style>
</head>
<body>

<!-- 漂浮爱心 -->
<div class="hearts-layer" id="heartsLayer"></div>

<div class="wrap">
  <div class="card">

    <!-- ===== 开场 ===== -->
    <section id="screen-start">
      <div class="title-badge">💖 粉色少女心实验室 💖</div>
      <h1>你是否喜欢上一个人？</h1>
      <p class="subtitle">每个人的心里，都藏着一个小小的秘密……<br>
        那个让你心跳漏拍的人，到底是喜欢，还是错觉？<br>
        ✨ 6 道题，测出你的真实心动指数 ✨</p>
      <button class="start-btn" onclick="startQuiz()">开始测试 💌</button>
      <p class="tip">♡ 凭直觉作答，越诚实越准哦 ♡</p>
    </section>

    <!-- ===== 答题 ===== -->
    <section id="screen-quiz" class="hidden">
      <div class="progress-area">
        <span class="progress-text" id="progressText">0/6</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="q-count" id="qCount">QUESTION 1</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
    </section>

    <!-- ===== 结果 ===== -->
    <section id="screen-result" class="hidden"></section>

  </div>
  <footer>🌸 仅供娱乐 · 喜欢就大胆去追吧 🌸</footer>
</div>

<script>
/* ================= 题库 ================= */
const QUESTIONS = [
  {
    q: "每天打开手机，你最期待看到谁的消息？",
    options: [
      { text: "当然是TA的消息！手机一响我就心跳加速", score: 3 },
      { text: "闺蜜/兄弟的八卦最香，吃瓜第一", score: 1 },
      { text: "谁的消息都行，随缘回复", score: 2 }
    ]
  },
  {
    q: "TA和别人聊得很开心时，你会？",
    options: [
      { text: "心里酸酸的，像偷喝了没加糖的柠檬水", score: 3 },
      { text: "完全没感觉，大家一起开心呀", score: 1 },
      { text: "假装玩手机，耳朵却偷偷竖起来", score: 2 }
    ]
  },
  {
    q: "如果TA约你周末出去玩，你的第一反应是？",
    options: [
      { text: "天哪！！立刻开始翻衣柜想穿什么！", score: 3 },
      { text: "有空就去呗，看心情再说", score: 1 },
      { text: "心里乐开花，但嘴上淡定地回个“好呀”", score: 2 }
    ]
  },
  {
    q: "深夜失眠时，你脑子里最多浮现的是？",
    options: [
      { text: "TA的笑容、TA的声音、TA的一切……", score: 3 },
      { text: "明天吃什么、作业怎么办、快递到哪了", score: 1 },
      { text: "今天和TA说话的场景，反复循环回放", score: 2 }
    ]
  },
  {
    q: "刷到TA发的朋友圈，你会？",
    options: [
      { text: "点赞评论一条龙，还忍不住反复看好几遍", score: 3 },
      { text: "刷到就顺手点个赞，然后划走", score: 1 },
      { text: "悄悄看完，连赞都不敢点，怕被发现", score: 2 }
    ]
  },
  {
    q: "如果TA突然官宣脱单了，你会？",
    options: [
      { text: "心碎成渣渣，感觉整个世界都灰暗了", score: 3 },
      { text: "真心祝福TA，然后继续快乐吃瓜", score: 1 },
      { text: "心里咯噔一下，但嘴上说着“恭喜恭喜”", score: 2 }
    ]
  }
];

/* ================= 结果配置 ================= */
const RESULTS = [
  {
    min: 80,
    emoji: "💘",
    title: "彻底沦陷！石锤喜欢！",
    desc: "恭喜你，藏不住啦！你满脑子都是TA，心跳为TA加速，情绪被TA牵动——这已经不是心动，是<b>沦陷</b>！别犹豫啦，勇敢一点点，或许TA也正在偷偷看你哦～",
    tips: "今日心动指数：爆表 💥"
  },
  {
    min: 60,
    emoji: "💕",
    title: "心动信号满格",
    desc: "你的心动指数已经很高啦！虽然嘴上还不肯承认，但身体和直觉都很诚实。再靠近一点点，多创造一些独处的机会，你们的故事就要开始咯～",
    tips: "今日心动指数：80% 📶"
  },
  {
    min: 40,
    emoji: "🌸",
    title: "友谊以上，恋人未满",
    desc: "你对TA有好感，但还没到“喜欢”的程度。或许只差一个契机：一次独处、一次谈心、一次并肩散步……心动就会悄悄发芽，静待花开吧～",
    tips: "今日心动指数：60% 🌱"
  },
  {
    min: 20,
    emoji: "🍑",
    title: "有一点点心动",
    desc: "你对TA的印象不错，偶尔会想起TA，但还没到神魂颠倒的地步。再观察观察，别着急下结论，感情这种事，慢慢来反而更甜～",
    tips: "今日心动指数：40% 🍬"
  },
  {
    min: 0,
    emoji: "🎀",
    title: "是纯洁的友情啦！",
    desc: "你和TA之间是清爽的友情，没有任何粉红泡泡！不过友情也很珍贵呀，能遇到合拍的朋友本身就是超级幸运的事，继续好好珍惜这份美好吧～",
    tips: "今日心动指数：20% 🧸"
  }
];

/* ================= 状态 ================= */
let current = 0;
let total = 0;

const $ = id => document.getElementById(id);

/* ================= 背景特效 ================= */
function createFloatingHearts() {
  const layer = $("heartsLayer");
  const emojis = ["💗", "💕", "💖", "🌸", "💞", "🩷", "✨", "🎀"];
  for (let i = 0; i < 22; i++) {
    const span = document.createElement("span");
    span.className = "float-heart";
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const size = 14 + Math.random() * 22;
    span.style.fontSize = size + "px";
    span.style.left = Math.random() * 100 + "vw";
    span.style.animationDuration = (7 + Math.random() * 9) + "s";
    span.style.animationDelay = (Math.random() * 10) + "s";
    layer.appendChild(span);
  }
}

function createSparkles(container) {
  for (let i = 0; i < 10; i++) {
    const span = document.createElement("span");
    span.className = "sparkle";
    span.textContent = "✦";
    span.style.fontSize = (10 + Math.random() * 10) + "px";
    span.style.left = Math.random() * 100 + "%";
    span.style.top = Math.random() * 100 + "%";
    span.style.animationDelay = (Math.random() * 3) + "s";
    container.appendChild(span);
  }
}

/* ================= 页面切换 ================= */
function show(id) {
  ["screen-start", "screen-quiz", "screen-result"].forEach(s => $(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

function startQuiz() {
  current = 0;
  total = 0;
  renderQuestion();
  show("screen-quiz");
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $("progressText").textContent = (current + 1) + "/6";
  $("progressFill").style.width = ((current) / QUESTIONS.length * 100) + "%";
  $("qCount").textContent = "QUESTION " + (current + 1);
  $("questionText").textContent = q.q;

  const box = $("optionsBox");
  box.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    const emoji = ["🌷", "🍓", "🫧"][i % 3];
    div.innerHTML = '<span class="opt-emoji">' + emoji + '</span>' + opt.text;
    div.onclick = () => selectAnswer(opt.score, div);
    box.appendChild(div);
  });
}

function selectAnswer(score, el) {
  // 已选过的选项取消高亮
  document.querySelectorAll("#optionsBox .option").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  total += score;

  setTimeout(() => {
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 450);
}

/* ================= 结果 ================= */
function showResult() {
  const max = QUESTIONS.length * 3;
  const min = QUESTIONS.length;
  const pct = Math.round((total - min) / (max - min) * 100);

  const r = RESULTS.find(r => pct >= r.min);

  $("screen-result").innerHTML =
    '<div class="result-emoji">' + r.emoji + '</div>' +
    '<div class="result-title">' + r.title + '</div>' +
    '<div class="score-ring" style="--pct:' + pct + '">' +
      '<div class="score-inner">' +
        '<div class="score-num">' + pct + '%</div>' +
        '<div class="score-label">心动指数</div>' +
      '</div>' +
    '</div>' +
    '<p class="tip">' + r.tips + '</p>' +
    '<div class="result-desc">' + r.desc + '</div>' +
    '<button class="again-btn" onclick="startQuiz()">再测一次 🔁</button>';

  show("screen-result");
  rainHearts();
}

function rainHearts() {
  const card = document.querySelector(".card");
  const emojis = ["💗", "💘", "💕", "🩷", "💖", "🌸"];
  const N = 26;
  for (let i = 0; i < N; i++) {
    setTimeout(() => {
      const span = document.createElement("span");
      span.className = "falling-heart";
      span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = Math.random() * 90 + "%";
      span.style.fontSize = (14 + Math.random() * 18) + "px";
      span.style.animationDuration = (2.2 + Math.random() * 2.5) + "s";
      card.appendChild(span);
      setTimeout(() => span.remove(), 5000);
    }, i * 130);
  }
}

/* ================= 初始化 ================= */
createFloatingHearts();
createSparkles(document.querySelector(".card"));
</script>
</body>
</html>
