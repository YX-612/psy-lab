<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天赋 · 职业方向测评（本地版）</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#a89bf8,#cfc7fb 45%,#efeaff);color:#3a3654;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #app{max-width:640px;margin:0 auto;padding:22px 14px 70px}
  .card{background:#fff;border-radius:22px;padding:22px 18px;margin-bottom:16px;box-shadow:0 6px 24px rgba(90,70,200,.10)}
  h1,h2,h3{margin:0}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .sec-h .ic{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#8f7ff2,#6c5ce7);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .sec-h h2{font-size:17px;flex:1}
  .sec-h .note{font-size:12px;color:#a5a1b8}
  .muted{color:#8b87a0}
  .btn-main{background:linear-gradient(90deg,#8f7ff2,#6c5ce7);color:#fff;border:none;padding:13px 46px;
    border-radius:999px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(108,92,231,.35)}
  .btn-main:active{transform:scale(.97)}
  .btn-ghost{background:#f3f1fd;color:#6c5ce7;border:none;padding:10px 20px;border-radius:999px;font-size:13.5px;cursor:pointer}
  .chip{display:inline-block;background:#efeaff;color:#6c5ce7;border-radius:999px;padding:4px 11px;font-size:12px;
    margin:3px 5px 3px 0;font-weight:600}
  /* 封面 */
  .cover-title{text-align:center;font-size:27px;letter-spacing:1px;margin-top:6px}
  .cover-sub{text-align:center;font-size:13px;color:#8b87a0;margin:10px 4px 4px;line-height:1.7}
  .quad{position:relative;width:min(330px,84vw);margin:22px auto 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .qcell{background:#fff;border-radius:16px;padding:30px 6px;text-align:center;font-weight:600;font-size:15px;
    box-shadow:0 4px 16px rgba(90,70,200,.14);color:#4a4568}
  .compass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
  .cover-btns{text-align:center}
  .cover-tip{text-align:center;font-size:12px;color:#a5a1b8;margin-top:12px;line-height:1.8}
  /* 答题 */
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .qtop .back{border:none;background:#f3f1fd;color:#6c5ce7;width:32px;height:32px;border-radius:10px;
    font-size:16px;cursor:pointer;flex:none}
  .qtop .pg{font-size:13px;color:#8b87a0;font-weight:600}
  .pbar{height:8px;background:#eceafd;border-radius:4px;overflow:hidden;margin-bottom:26px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#8f7ff2,#6c5ce7);border-radius:4px;transition:width .25s}
  .qtext{font-size:18.5px;font-weight:700;line-height:1.65;text-align:center;margin:8px 2px 26px}
  .opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:1.5px solid #e6e2f8;
    background:#fff;font-size:15px;margin-bottom:11px;cursor:pointer;color:#3a3654;font-family:inherit}
  .opt:hover{border-color:#8f7ff2;background:#f7f5ff}
  .opt b{display:inline-block;width:24px;height:24px;border-radius:8px;background:#f0edfe;color:#6c5ce7;
    text-align:center;line-height:24px;font-size:13px;margin-right:10px}
  .qhint{text-align:center;font-size:12px;color:#b3afc8;margin-top:18px}
  /* 雷达图 */
  .radar-wrap{text-align:center}
  .legend{display:flex;justify-content:center;gap:14px;font-size:11.5px;color:#6d6986;margin-top:4px;flex-wrap:wrap}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  /* 天赋条目 */
  .trow{display:flex;align-items:center;gap:10px;margin:13px 0}
  .trow .lt{width:27px;height:27px;border-radius:8px;background:#6c5ce7;color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none}
  .trow .tn{width:78px;font-size:14px;font-weight:600;flex:none}
  .trow .track{flex:1;height:10px;background:#eceafd;border-radius:5px;overflow:hidden}
  .trow .fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#9b8cf5,#6c5ce7)}
  .trow .sc{width:30px;text-align:right;font-size:15px;font-weight:700;flex:none}
  .trow .lv{width:56px;text-align:right;font-size:11.5px;flex:none}
  .lv2{color:#6c5ce7;font-weight:700}.lv1{color:#8b7ff0;font-weight:600}.lv0{color:#b3b0c0}
  /* 类型卡 */
  .type-name{font-size:24px;font-weight:800;margin:4px 0 10px}
  .type-axis{font-size:14px;line-height:1.8;margin:10px 0 2px}
  .sub-h{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;margin:16px 0 9px}
  .quotebox{background:#f4f2fe;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.8}
  .warnbox{background:#fdf6e3;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.8;color:#7a5f1c}
  /* 深度解读 */
  .dd-tag{font-size:11.5px;color:#a5a1b8}
  .talent-row{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .talent-row .tile{width:48px;height:48px;border-radius:14px;background:#fdf3d8;display:flex;align-items:center;
    justify-content:center;font-size:24px;flex:none}
  .talent-row .tname{font-size:20px;font-weight:800}
  .tmini{display:flex;align-items:center;gap:8px;margin-top:5px}
  .tmini .track{width:92px;height:7px;background:#f0edfe;border-radius:4px;overflow:hidden}
  .tmini .fill{display:block;height:100%;background:#f5a623;border-radius:4px}
  .tmini span{font-size:12.5px;color:#8b87a0}
  .dquote{background:#fff8e1;border-left:4px solid #f5a623;border-radius:0 12px 12px 0;padding:11px 13px;
    font-weight:700;color:#9a6b1f;font-size:14.5px;line-height:1.7;margin:12px 0}
  ul.dots{margin:6px 0;padding:0;list-style:none}
  ul.dots li{font-size:13.5px;line-height:1.75;padding-left:15px;position:relative;margin:5px 0}
  ul.dots li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:#8f7ff2}
  .syn{display:flex;gap:8px;background:#f2fbf6;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.7}
  .syn b{color:#1f9d55;flex:none}
  /* 职业卡 */
  .codebox{background:#f4f2fe;border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.8;margin-bottom:16px}
  .codebox b{color:#6c5ce7;font-size:16px}
  .career{border:1px solid #eee9fb;border-radius:14px;padding:13px 13px 12px;margin-bottom:10px;background:#fdfcff}
  .crow{display:flex;align-items:center;gap:8px}
  .rank{width:22px;height:22px;border-radius:7px;background:#6c5ce7;color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:none}
  .cname{font-size:15.5px;font-weight:700;flex:1}
  .cpct{color:#6c5ce7;font-weight:800;font-size:15px}
  .cbar{height:7px;background:#eceafd;border-radius:4px;margin:9px 0 8px;overflow:hidden}
  .cbar i{display:block;height:100%;background:linear-gradient(90deg,#9b8cf5,#6c5ce7);border-radius:4px}
  .cfit{color:#6d6986;font-size:12.5px;margin-top:6px;line-height:1.7}
  .cwhy{background:#eff7ef;color:#3f7d46;border-radius:8px;padding:6px 9px;font-size:12.5px;margin-top:7px;line-height:1.7}
  .crisk{color:#a09cb4;font-size:12px;margin-top:6px;line-height:1.7}
  .cstep{color:#c87d1e;font-size:12.5px;margin-top:6px;line-height:1.7}
  .caution{background:#fdf6e3;border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.8;margin-bottom:8px}
  .caution b{color:#7a5f1c}
  .cbasis{color:#b0adc2;font-size:11px;margin-top:8px;line-height:1.7;border-top:1px dashed #eee9fb;padding-top:7px}
  /* 行动计划 */
  .plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pcol{background:#f6f4ff;border-radius:14px;padding:13px 12px}
  .pcol h3{font-size:14.5px}
  .pcol .pt{font-size:11.5px;color:#a5a1b8;margin:3px 0 8px}
  .pitem{display:flex;gap:6px;font-size:12.8px;line-height:1.7;margin:9px 0;color:#4a4568}
  .pitem .ck{color:#1f9d55;font-weight:800;flex:none}
  .endnote{background:#f6f4ff;border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.9;color:#5c5878;margin-top:14px}
  .footer{text-align:center;font-size:11.5px;color:#b3afc8;line-height:1.8;padding:6px 10px 0}
  .act-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  @media (max-width:560px){.plan{grid-template-columns:1fr}.trow .tn{width:64px;font-size:13px}}
  @media print{
    body{background:#fff}
    .card{box-shadow:none;border:1px solid #eee;break-inside:avoid}
    .act-row,.qhint,.cover-btns,.footer{display:none}
  }
</style>
</head>

  function deepText(score){ return score>=16?"非常擅长":(score>=12?"比较擅长":"待发展"); }

    var arr = Object.keys(HOL).map(function(h){
      var sum=0; for(var k in HOL[h].w){ sum += HOL[h].w[k]*s[k]; }

    return arr.slice(0,3).map(function(x){ return x.h; });

      return DIMS.indexOf(a)-DIMS.indexOf(b);
    }).slice(0,3);
  }

      var pct = Math.round(Math.min(95, Math.max(50, 40+tb+bonus+mx*0.4)));
      return {c:c,pct:pct,rank:rank,idx:idx,tb:tb,bonus:bonus,hit:hit};

      if(b.pct!==a.pct) return b.pct-a.pct;
      if(a.rank!==b.rank) return a.rank-b.rank;
      return a.idx-b.idx;
    }).slice(0,6);
  }

  }

    var t3 = top3(s);

  }

  function demoAnswers(){ // 复刻截图那份：A8 B8 C15 D10 E13 F15 G8 H10 I12 J15

               F:[3,3,3,3,3],G:[2,2,2,1,1],H:[2,2,2,2,2],I:[3,3,2,2,2],J:[3,3,3,3,3]};
    var a=[]; DIMS.forEach(function(d,di){ per[d.k].forEach(function(v){ a.push(v); }); });
    return a;
  }

  return {DIMS:DIMS,QUESTIONS:QUESTIONS,HOL:HOL,scores:scores,lvl:lvl,lvlText:lvlText,
    deepText:deepText,holland:holland,top3:top3,buildResult:buildResult,synergy:synergy,
    demoAnswers:demoAnswers};
})();

        '<div class="muted" style="font-size:12px;letter-spacing:1px">天赋能力测评 × 职业兴趣测评</div>' +
        '<h1 class="cover-title">天赋 · 职业方向</h1>' +
        '<p class="cover-sub">基于兴趣、能力、思维与成长潜力，<br>辅助你探索更适合的职业选择。</p>' +
        '<div class="quad">' +
          '<div class="qcell">兴趣探索</div><div class="qcell">能力识别</div>' +
          '<div class="compass">🧭</div>' +
          '<div class="qcell">职业匹配</div><div class="qcell">方向规划</div>' +
        '</div>' +
        '<div class="cover-btns"><button class="btn-main" id="startBtn">'+(hasProgress?"重新开始":"开始测评")+'</button></div>' +
        (cont ? '<div class="cover-btns" style="margin-top:12px"><button class="btn-ghost" id="contBtn">'+cont+'</button></div>' : '') +
        '<div class="cover-tip">本地复刻版 · 50 题 · 约 5 分钟<br>答案只存在本机浏览器，不上传任何数据<br>示例报告只看不存，不影响你的作答<br><a href="?demo=1" style="color:#8f7ff2">先看一份示例报告 →</a></div>' +
      '</div>' +
      '<div class="footer">复刻自购物平台在售的天赋测评 · 仅供自测参考 · 不构成职业建议</div>';
    document.getElementById("startBtn").onclick = function(){ startTest(); };
    var cb = document.getElementById("contBtn");
    if(cb) cb.onclick = function(){ if(S.done) renderResult(S.answers); else renderQuiz(); };
  }

  function startTest(){
    S.order = makeOrder(); S.answers = new Array(50).fill(0); S.idx = 0; S.done = false;
    save(); renderQuiz();
  }

  // ---------- 答题 ----------
  var OPTS = ["很不像我","不太像我","比较像我","非常像我"];

  function renderQuiz(){
    inQuiz = true;
    if(S.idx>=50){ finish(); return; }
    var qi = S.order[S.idx];
    var dim = Math.floor(qi/5), r = qi%5;
    var pct = Math.round(S.idx/50*100);
    app.innerHTML =
      '<div class="card">' +
        '<div class="qtop">' +
          (S.idx>0 ? '<button class="back" id="backBtn">←</button>' : '') +
          '<div class="pg">第 '+(S.idx+1)+' / 50 题</div>' +
        '</div>' +
        '<div class="pbar"><i style="width:'+pct+'%"></i></div>' +
        '<div class="qtext">'+TT.QUESTIONS[dim][r]+'</div>' +
        OPTS.map(function(t,i){
          return '<button class="opt" data-v="'+(i+1)+'"><b>'+(i+1)+'</b>'+t+'</button>';
        }).join("") +
        '<div class="qhint">凭第一感觉选，别想太久 · 键盘 1-4 可直接答</div>' +
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
      btn.onclick = function(){
        S.answers[qi] = parseInt(btn.getAttribute("data-v"),10);
        S.idx++; save();
        if(S.idx>=50){ finish(); } else { renderQuiz(); }
      };
    });
    var bb = document.getElementById("backBtn");
    if(bb) bb.onclick = function(){ S.idx--; save(); renderQuiz(); };
    window.scrollTo(0,0);
  }

  function finish(){ S.done = true; save(); renderResult(S.answers); }

  document.addEventListener("keydown", function(e){
    if(!inQuiz) return;
    if(e.key>="1" && e.key<="4"){
      var btns = app.querySelectorAll(".opt");
      var b = btns[parseInt(e.key,10)-1]; if(b) b.click();
    } else if(e.key==="Backspace" && S.idx>0){ e.preventDefault(); S.idx--; save(); renderQuiz(); }
  });

  // ---------- 雷达图 ----------
  function radarSVG(s){
    var cx=240, cy=205, R=128, N=10;
    function pt(i,rad){ var a=(-90+i*36)*Math.PI/180; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; }
    var svg = '<svg viewBox="0 0 480 410" style="width:100%;max-width:440px">';
    [5,10,15,20].forEach(function(L){
      var p=[]; for(var i=0;i<N;i++){ p.push(pt(i,R*L/20).map(function(v){return v.toFixed(1);}).join(",")); }
      svg += '<polygon points="'+p.join(" ")+'" fill="none" stroke="#e6e2f8" stroke-width="1"/>';
    });
    for(var i=0;i<N;i++){ var q=pt(i,R); svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#efecfa" stroke-width="1"/>'; }
    var poly=[]; TT.DIMS.forEach(function(d,i){ poly.push(pt(i,R*s[d.k]/20).map(function(v){return v.toFixed(1);}).join(",")); });
    svg += '<polygon points="'+poly.join(" ")+'" fill="rgba(108,92,231,.18)" stroke="#6c5ce7" stroke-width="2" stroke-linejoin="round"/>';
    TT.DIMS.forEach(function(d,i){
      var p = pt(i,R*s[d.k]/20);
      var col = TT.lvl(s[d.k])===2 ? "#6c5ce7" : (TT.lvl(s[d.k])===1 ? "#8f7ff2" : "#c9c5da");
      svg += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+col+'"/>';
      var lp = pt(i,R+30);
      var a=(-90+i*36)*Math.PI/180, c=Math.cos(a);
      var anchor = c>0.25 ? "start" : (c<-0.25 ? "end" : "middle");
      var dy = Math.sin(a)<-0.3 ? -4 : (Math.sin(a)>0.3 ? 14 : 5);
      svg += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" fill="#55516e" font-weight="600">'+d.k+'('+s[d.k]+'分)</text>';
    });
    svg += '</svg>';
    return svg;
  }

  // ---------- 结果页 ----------
  function renderResult(answers){
    inQuiz = false;
    var res = TT.buildResult(TT.scores(answers));
    var s = res.scores;
    var date = new Date().toLocaleDateString("zh-CN");
    var holDesc = res.code.map(function(h){ return h+" "+TT.HOL[h].label; }).join(" · ");

    var h = '';
    // 头部
    h += '<div class="card" style="text-align:center">';
    h += '<div class="muted" style="font-size:12px">天赋类型解读 · '+date+'</div>';
    h += '<h1 style="font-size:27px;margin:10px 0 12px">'+res.top3[0].emoji+' '+res.typeName+'</h1>';
    h += '<div>' + res.top3.map(function(d){ return '<span class="chip">'+d.emoji+' '+d.name+'</span>'; }).join("") + '</div>';
    h += '<div style="margin-top:12px;font-size:13px" class="muted">霍兰德职业代码：<b style="color:#6c5ce7;font-size:15px">'+res.code.join("")+'</b>（'+holDesc+'）</div>';
    h += '<div class="act-row"><button class="btn-main" id="printBtn">保存 / 打印报告</button>' +
         '<button class="btn-ghost" id="redoBtn">重新测一次</button>' +
         '<button class="btn-ghost" id="homeBtn">回封面</button></div>';
    h += '</div>';

    // 雷达图
    h += '<div class="card"><div class="sec-h"><div class="ic">🕸️</div><h2>天赋能力图谱</h2><div class="note">10维度全景展示</div></div>';
    h += '<div class="radar-wrap">'+radarSVG(s)+'</div>';
    h += '<div class="legend"><span><i style="background:#6c5ce7"></i>16-20 非常擅长</span>' +
         '<span><i style="background:#8f7ff2"></i>12-15 有些擅长</span>' +
         '<span><i style="background:#c9c5da"></i>4-11 待发展</span></div></div>';

    // 详情条
    h += '<div class="card"><div class="sec-h"><div class="ic">📋</div><h2>各项天赋详情</h2><div class="note">满分 20</div></div>';
    TT.DIMS.forEach(function(d){
      var lt = TT.lvlText(s[d.k]);
      h += '<div class="trow"><div class="lt">'+d.k+'</div><div class="tn">'+d.name+'</div>' +
           '<div class="track"><i class="fill" style="width:'+(s[d.k]/20*100)+'%"></i></div>' +
           '<div class="sc">'+s[d.k]+'</div><div class="lv lv'+TT.lvl(s[d.k])+'">'+lt+'</div></div>';
    });
    h += '</div>';

    // 类型解读
    h += '<div class="card"><div class="sec-h"><div class="ic">➕</div><h2>天赋类型解读</h2></div>';
    h += '<div style="font-size:30px">'+res.top3[0].emoji+'</div>';
    h += '<div class="type-name">'+res.typeName+'</div>';
    h += '<div>' + res.top3.map(function(d){ return '<span class="chip">'+d.emoji+' '+d.name+'</span>'; }).join("") + '</div>';
    h += '<div style="font-size:15.5px;font-weight:700;margin:14px 0 6px">你以'+res.top3[0].name+'天赋为核心，'+res.top3[1].name+'与'+res.top3[2].name+'天赋为两翼，组合独特</div>';
    h += '<div class="type-axis">'+res.axisText+'</div>';
    h += '<div class="sub-h">💪 核心优势组合</div><div class="quotebox">'+res.comboText+'</div>';
    h += '<div class="sub-h">⚡ 潜在挑战</div><div class="warnbox">'+res.challenge+'</div></div>';

    // 深度解读（前两位）
    [0,1].forEach(function(t){
      var d = res.top3[t];
      h += '<div class="card"><div class="sec-h"><div class="ic">🏆</div><h2>核心优势深度解读</h2><div class="dd-tag">你的第'+(t===0?"一":"二")+'天赋</div></div>';
      h += '<div class="talent-row"><div class="tile">'+d.emoji+'</div><div><div class="tname">'+d.name+'天赋</div>' +
           '<div class="tmini"><span class="track"><i class="fill" style="width:'+(s[d.k]/20*100)+'%"></i></span><span>'+s[d.k]+'/20 · '+TT.deepText(s[d.k])+'</span></div></div></div>';
      h += '<div class="dquote">'+d.quote+'</div>';
      h += '<p style="font-size:14px;line-height:1.9">'+d.desc+'</p>';
      h += '<div class="sub-h">✨ 你可能的特征</div><ul class="dots">'+d.traits.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>';
      h += '<div class="sub-h">🧰 职场最佳应用场景</div><div>'+d.scenes.map(function(x){return '<span class="chip">'+x+'</span>';}).join("")+'</div>';
      h += '<div class="sub-h">⚠️ 需要注意的陷阱</div><div class="warnbox"><ul class="dots" style="margin:0">'+
           d.traps.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>';
      if(t===1){
        h += '<div class="sub-h">💞 与其他天赋的协同</div>';
        [0,2].forEach(function(o){
          var od = res.top3[o];
          h += '<div class="syn"><b>+ '+od.name+'天赋</b><span>'+TT.synergy(d.k, od.k)+'</span></div>';
        });
      }
      h += '<div class="sub-h">💡 发挥建议</div><ul class="dots">' +
           [d.act.s, d.act.m, d.act.l].map(function(x){return '<li>'+x+'</li>';}).join("") + '</ul>';
      h += '</div>';
    });

    // 职业指南
    h += '<div class="card"><div class="sec-h"><div class="ic">💼</div><h2>职业发展指南</h2><div class="note">基于天赋的职业匹配</div></div>';
    h += '<div class="codebox">你的霍兰德职业代码：<b>'+res.code.join("")+'</b><br>' +
         res.code.map(function(l){ return l+" "+TT.HOL[l].label+"（"+TT.HOL[l].desc+"）"; }).join("<br>") + '</div>';
    h += '<div class="sec-h" style="margin-bottom:10px"><h2 style="font-size:15px">💼 推荐职业方向</h2><div class="note">'+res.careers.length+'个</div></div>';
    res.careers.forEach(function(m,i){
      var c = m.c;
      h += '<div class="career"><div class="crow"><div class="rank">'+(i+1)+'</div><div class="cname">'+c.n+'</div><div class="cpct">'+m.pct+'%</div></div>' +
           '<div class="cbar"><i style="width:'+m.pct+'%"></i></div>' +
           '<div>' + c.t.map(function(t){ var d=TT.DIMS.filter(function(x){return x.k===t;})[0]; return '<span class="chip">'+d.emoji+' '+d.name+'</span>'; }).join("") + '</div>' +
           '<div class="cwhy">💡 '+c.why+'</div>' +
           '<div class="cfit">适合：'+c.fit+'<br>风险：'+c.risk+'</div>' +
           '<div class="cstep">🔗 '+c.step+'</div>' +
           '<div class="cbasis">🔬 匹配依据：霍兰德 '+c.h+(m.rank<3?'（你的第'+(m.rank+1)+'位，+'+m.bonus+'分）':'（未进前三，+2分）')+
           (m.hit.length? '；'+m.hit.map(function(t){var d=TT.DIMS.filter(function(x){return x.k===t;})[0];return d.name;}).join('、')+' 在你前三天赋（+'+m.tb+'分）' : '；前三天赋无直接加成') +
           '</div></div>';
    });
    h += '<div class="muted" style="font-size:12.5px;margin:10px 2px 14px">小贴士：在选择时，不妨想一想哪类工作更能让你的天赋被看见、被需要。</div>';
    h += '<div class="sub-h">⚠️ 建议谨慎的方向</div>';
    res.caution.forEach(function(c){ h += '<div class="caution"><b>'+c[0]+'：</b>'+c[1]+'</div>'; });
    h += '</div>';

    // 行动计划
    h += '<div class="card"><div class="sec-h"><div class="ic">🗂️</div><h2>行动计划</h2><div class="note">分阶段成长路径</div></div>';
    h += '<p style="font-size:13.5px;line-height:1.9" class="muted">下面是一份可以直接照着执行的清单，帮你把「看到报告」变成「真正发生改变」。建议先从短期目标里挑 1-2 条开始。</p>';
    h += '<div class="plan">';
    [["🎯 短期目标","1-3 个月",res.plan.s],["📈 中期发展","6-12 个月",res.plan.m],["☀️ 长期愿景","持续思考",res.plan.l]].forEach(function(col){
      h += '<div class="pcol"><h3>'+col[0]+'</h3><div class="pt">'+col[1]+'</div>' +
           col[2].map(function(x){ return '<div class="pitem"><span class="ck">✓</span><span>'+x+'</span></div>'; }).join("") + '</div>';
    });
    h += '</div><div class="endnote">'+res.note+'</div></div>';

    h += '<div class="footer">本报告由本地页面生成 · 仅供自测参考 · 不构成职业建议</div>';

    app.innerHTML = h;
    document.getElementById("printBtn").onclick = function(){ window.print(); };
    document.getElementById("redoBtn").onclick = function(){
      if(confirm("清空本次作答，重新测一次？")) startTest();
    };
    document.getElementById("homeBtn").onclick = renderCover;
    window.scrollTo(0,0);
  }

  // ---------- 入口 ----------
  if(location.search.indexOf("debug")>=0){
    setTimeout(function(){
      var w = document.documentElement.clientWidth;
      var bad = [];
      document.querySelectorAll("#app *").forEach(function(el){
        var r = el.getBoundingClientRect();
        if (r.right > w + 1) bad.push(el.tagName+"."+el.className+" w="+Math.round(r.width)+" right="+Math.round(r.right));
      });
      var pre = document.createElement("pre"); pre.id = "dbg";
      pre.textContent = "clientW="+w+" scrollW="+document.documentElement.scrollWidth+"\n"+bad.slice(0,40).join("\n");
      document.body.insertBefore(pre, document.body.firstChild);
    }, 300);
  }
  if(location.search.indexOf("quiz")>=0){
    startTest();
    var qm = location.search.match(/quiz=(\d+)/); if(qm){ S.idx = Math.min(49, parseInt(qm[1],10)-1); save(); renderQuiz(); }
  } else if(location.search.indexOf("demo")>=0){
    renderResult(TT.demoAnswers()); // 只看不存，不碰真实作答
  } else if(S.done){
    renderResult(S.answers);
  } else {
    renderCover();
  }
})();
</script>
</body>
</html>
