// ---- APP ----
// ============================================================
// 诸子百家人格测试 — 核心逻辑
// ============================================================

const STATE = {
  currentQ: 0,          // 当前题号 (0-indexed)
  scores: {},           // { schoolId: number }
  answers: [],          // [{ school, text }]
  result: null,         // 最终结果
  started: false,
  finished: false
};

// 初始化分数
function initScores() {
  const s = {};
  SCHOOLS.forEach(sch => { s[sch.id] = 0; });
  return s;
}

// 开始测试
function startTest() {
  STATE.currentQ = 0;
  STATE.scores = initScores();
  STATE.answers = [];
  STATE.result = null;
  STATE.started = true;
  STATE.finished = false;
}

// 选择答案
function selectAnswer(schoolId, text) {
  STATE.scores[schoolId]++;
  STATE.answers.push({ school: schoolId, text });

  if (STATE.currentQ < QUESTIONS.length - 1) {
    STATE.currentQ++;
    return { done: false, nextQ: STATE.currentQ };
  } else {
    // 答题完成，计算结果
    STATE.finished = true;
    STATE.result = calculateResult();
    return { done: true };
  }
}

// 计算最高分流派
function calculateResult() {
  let maxScore = 0;
  let topSchools = [];

  for (const [id, score] of Object.entries(STATE.scores)) {
    if (score > maxScore) {
      maxScore = score;
      topSchools = [id];
    } else if (score === maxScore) {
      topSchools.push(id);
    }
  }

  // 并列最高分：把全部并列流派一并返回（不再用数组顺序决定结果）
  const tiedSchools = topSchools.map(function(id) {
    return SCHOOLS.find(function(s) { return s.id === id; });
  });
  return {
    school: tiedSchools[0],
    tiedSchools: tiedSchools,
    tied: tiedSchools.length > 1,
    scores: { ...STATE.scores },
    maxScore,
    answers: [...STATE.answers]
  };
}

// 生成分享文案
function generateShareText(school) {
  return `🔮 测完发现我是${school.label}·${school.master}！原来我的骨子里藏着千年诸子风骨，快来测测你属于哪家先贤～`;
}

// 获取雷达图数据
function getRadarData() {
  return SCHOOLS.map(s => ({
    name: s.name,
    value: STATE.scores[s.id] || 0
  }));
}


// ============================================================
// UI 控制器
// ============================================================
var chartInstance = null;

function showPage(id) {
  var ps = document.querySelectorAll('.page');
  for (var i = 0; i < ps.length; i++) ps[i].classList.remove('active');
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showQuiz() {
  try {
    startTest();
    showPage('page-quiz');
    renderQuestion();
  } catch(e) {
    console.error('showQuiz error:', e);
    alert('页面异常，请刷新重试');
  }
}

function renderQuestion() {
  var q = QUESTIONS[STATE.currentQ];
  var c = document.getElementById('qContainer');
  if (!q || !c) return;
  var h = '<div class="q-card"><div class="q-num">\u7b2c ' + (STATE.currentQ + 1) + ' / ' + QUESTIONS.length + ' \u9898</div><div class="q-text">' + q.text + '</div><div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var o = q.options[i];
    h += '<div class="opt" data-school="' + o.school + '"><span class="opt-icon">' + o.icon + '</span><span class="opt-text">' + o.text + '</span></div>';
  }
  h += '</div></div>';
  c.innerHTML = h;
  updateProgress();
  // Bind events
  var opts = c.querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].addEventListener('click', optClickHandler);
  }
}

function optClickHandler(e) {
  var el = e.currentTarget;
  try {
    if (el.classList.contains('sel')) return;
    var all = document.querySelectorAll('.opt');
    for (var i = 0; i < all.length; i++) all[i].style.pointerEvents = 'none';
    el.classList.add('sel');
    var schoolId = el.getAttribute('data-school');
    var q = QUESTIONS[STATE.currentQ];
    var opt = null;
    for (var i = 0; i < q.options.length; i++) { if (q.options[i].school === schoolId) { opt = q.options[i]; break; } }
    var result = selectAnswer(schoolId, opt.text);
    if (result.done) {
      setTimeout(function() { showResult(); }, 500);
    } else {
      setTimeout(function() { renderQuestion(); }, 280);
      setTimeout(function() { var a = document.querySelectorAll('.opt'); for (var j = 0; j < a.length; j++) a[j].style.pointerEvents = ''; }, 280);
    }
  } catch(e) {
    console.error('optClick error:', e);
    var a = document.querySelectorAll('.opt');
    for (var i = 0; i < a.length; i++) a[i].style.pointerEvents = '';
  }
}

function updateProgress() {
  var total = QUESTIONS.length;
  var done = STATE.currentQ;
  var pct = Math.round((done / total) * 100);
  var pt = document.getElementById('progText');
  var pp = document.getElementById('progPct');
  var pf = document.getElementById('progFill');
  if (pt) pt.textContent = '\u7b2c ' + (done + 1) + ' / ' + total + ' \u9898';
  if (pp) pp.textContent = pct + '%';
  if (pf) pf.style.width = pct + '%';
}

function showResult() {
  try {
    var r = STATE.result;
    if (!r || !r.school) throw new Error('no result');
    var s = r.school;
    showPage('page-result');
    setText('rMaster', s.master);
    setText('rLabel', s.name);
    setText('rTagline', '\u2014\u2014 ' + (s.tags || []).slice(0,3).join(' \u00b7 ') + ' \u2014\u2014');
        var _tn = (r.tiedSchools || []).map(function(x) { return x.name; });
        if (_tn.length > 1) {
          var _el = document.getElementById('rTagline');
          if (_el) _el.textContent += '\u3000\uFF08\u4F60\u540C\u65F6\u5E76\u5217\uFF1A' + _tn.join(' \u00b7 ') + '\uFF09';
        }
    setText('rPersonality', s.personality);
    setHTML('rStrengths', (s.strengths || []).map(function(t) { return '<li>' + t + '</li>'; }).join(''));
    setHTML('rWeaknesses', (s.weaknesses || []).map(function(t) { return '<li>' + t + '</li>'; }).join(''));
    setText('rQuote', s.quote);
    setText('rAdvice', s.advice);
    renderRadar();
  } catch(e) {
    console.error('showResult error:', e);
  }
}

function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = (v != null ? v : ''); }
function setHTML(id, v) { var el = document.getElementById(id); if (el) el.innerHTML = (v != null ? v : ''); }

function renderRadar() {
  var canvas = document.getElementById('radarChart');
  if (!canvas) return;
  if (chartInstance) { try { chartInstance.destroy(); } catch(e) {} chartInstance = null; }
  var fm = document.getElementById('radarFallbackMsg');
  if (fm) fm.style.display = 'none';

  var data = getRadarData();
  if (typeof Chart !== 'undefined') {
    try {
      chartInstance = new Chart(canvas, {
        type: 'radar',
        data: {
          labels: data.map(function(d) { return d.name; }),
          datasets: [{
            label: '\u6d41\u6d3e\u5951\u5408\u5ea6',
            data: data.map(function(d) { return d.value; }),
            backgroundColor: 'rgba(192,57,43,0.1)',
            borderColor: 'rgba(192,57,43,0.6)',
            borderWidth: 2,
            pointBackgroundColor: 'rgba(192,57,43,0.8)',
            pointBorderColor: '#fff',
            pointBorderWidth: 1,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false },
            tooltip: { backgroundColor: 'rgba(60,36,21,0.9)', titleFont: { family: 'Noto Serif SC' }, bodyFont: { family: 'Noto Serif SC' } }
          },
          scales: {
            r: {
              beginAtZero: true,
              ticks: { stepSize: 1, font: { family: 'Noto Serif SC', size: 11 }, backdropColor: 'transparent' },
              pointLabels: { font: { family: 'Noto Serif SC', size: 12 }, color: '#5a4a3a' },
              grid: { color: 'rgba(60,36,21,0.08)' },
              angleLines: { color: 'rgba(60,36,21,0.1)' }
            }
          }
        }
      });
      return;
    } catch(e) {
      console.warn('Chart.js failed:', e.message);
    }
  }
  drawRadarFallback(canvas, data);
}

function drawRadarFallback(canvas, data) {
  var pw = canvas.parentElement;
  var W = pw ? pw.clientWidth : 300;
  if (W > 360) W = 360; if (W < 200) W = 200;
  var H = W, cx = W/2, cy = H/2, R = Math.min(W,H)*0.32;
  var n = data.length, maxVal = 1;
  for (var i = 0; i < n; i++) { if (data[i].value > maxVal) maxVal = data[i].value; }
  var dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  function angle(i) { return -Math.PI/2 + (2*Math.PI*i)/n; }
  for (var lv = 1; lv <= maxVal; lv++) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var a = angle(i%n), r = (lv/maxVal)*R, x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(60,36,21,0.1)'; ctx.lineWidth=1; ctx.stroke();
  }
  for (var i = 0; i < n; i++) {
    var a = angle(i);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
    ctx.strokeStyle='rgba(60,36,21,0.12)'; ctx.stroke();
  }
  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var idx = i%n, a = angle(idx), r = (data[idx].value/maxVal)*R, x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fillStyle='rgba(192,57,43,0.12)'; ctx.fill();
  ctx.strokeStyle='rgba(192,57,43,0.6)'; ctx.lineWidth=2; ctx.stroke();
  for (var i = 0; i < n; i++) {
    var a = angle(i), r = (data[i].value/maxVal)*R, x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
    ctx.beginPath(); ctx.arc(x,y,4,0,2*Math.PI);
    ctx.fillStyle='rgba(192,57,43,0.8)'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (var i = 0; i < n; i++) {
    var a = angle(i);
    ctx.fillStyle='#5a4a3a'; ctx.font='12px "Noto Serif SC",serif';
    ctx.fillText(data[i].name, cx+(R+18)*Math.cos(a), cy+(R+18)*Math.sin(a));
    ctx.fillStyle='rgba(192,57,43,0.6)'; ctx.font='10px "Noto Serif SC",serif';
    ctx.fillText(data[i].value+'\u5206', cx+(R+32)*Math.cos(a), cy+(R+32)*Math.sin(a));
  }
  if (fm) fm.style.display = 'block';
}

function copyShare() {
  try {
    var s = STATE.result.school;
    var text = generateShareText(s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { showToast('\u2705 \u5206\u4eab\u6587\u6848\u5df2\u590d\u5236\uff0c\u5feb\u53bb\u53d1\u670b\u53cb\u5708\u5427\uff01'); }).catch(function() { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  } catch(e) { showToast('\u274c \u590d\u5236\u5931\u8d25'); }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('\u2705 \u5206\u4eab\u6587\u6848\u5df2\u590d\u5236');
  } catch(e) { showToast('\uD83D\uDCCB \u8bf7\u624b\u52a8\u590d\u5236'); }
}

function showToast(msg) {
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

function resetAll() {
  try { if (chartInstance) { chartInstance.destroy(); chartInstance = null; } } catch(e) {}
  showPage('page-home');
}
